services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contabil
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contabil"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      - APP_ENV=staging
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/contabil
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=["http://localhost:5173", "http://localhost:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.contexts.matching_auditing.worker.celery_app worker --loglevel=info
    environment:
      - APP_ENV=staging
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@postgres:5432/contabil
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: 
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8001/api/v1
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
