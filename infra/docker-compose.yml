version: '3.8'

services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ../backend:/app
      - ../data_lake:/data_lake
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      - DB_URL=sqlite:////data_lake/canonical/database.sqlite
      - PYTHONPATH=/app

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ../frontend:/app
    command: >
      bash -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
